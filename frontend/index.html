<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="description" content="Book a slot at local businesses. No queues, no waiting — find and book open time slots in seconds.">
<meta property="og:title" content="Nakwela — Book local businesses instantly.">
<meta property="og:description" content="Book local  businesses instantly.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nakwela.netlify.app/">
<meta property="og:image" content="https://nakwela.netlify.app//assets/og-image.png">
<link rel="canonical" href="https://nakwela.netlify.app/">
<link rel="icon" href="assets/icons/justbook-it-1.png" type="image/png">
<title>Nakwela</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">Nakwe<span class="brand-dot">la</span></div>
    </div>
  </div>

  <div class="main">

    <div class="hero-line">Book your spot.<br>No queueing, no guessing.</div>


    <div class="section-label">Recent &amp; popular</div>
    <div class="card-row" id="recentCards"></div>

    <div class="section-label">Search a business</div>
    <div class="search-wrap">
      <span class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <input type="text" class="search-input" id="searchInput" placeholder="Try 'barber', 'Olieven', 'braids'...">
    </div>
    <div class="search-hint" id="searchHint">Search by name, service or  to see who's open near you.</div>

    <div class="biz-list" id="bizList"></div>

    <div class="register-banner" id="registerBanner">
      <div class="register-banner-text">
        <div class="register-banner-title">Own a business?</div>
        <div class="register-banner-sub">List it free and start taking bookings today.</div>
      </div>
      <div class="register-banner-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

  </div>

</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>

<script src="js/index.js"></script>
</body>
</html>
